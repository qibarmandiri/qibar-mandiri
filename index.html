<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Qibar Mandiri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0E1A;--surface:#111729;--ink:#EAF0FF;--mute:#8C97B5;--line:#232C45;--accent:#8FB4FF;--on:#0A0E1A;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#F5F7FC;--surface:#fff;--ink:#0A0E1A;--mute:#5A6483;--line:#D9DFEE;--accent:#3A5BDB;--on:#fff;color-scheme:light}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:300 17px/1.75 Sora,system-ui,sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);overflow-x:hidden}
h1,h2,h3{font-weight:300;letter-spacing:-.03em;line-height:1.1;margin:0}
h1{font-size:clamp(2rem,7vw,3.25rem);letter-spacing:-.04em}
h2{font-size:clamp(1.8rem,6vw,2.6rem);margin-bottom:2rem}
h3{font-size:1.4rem;font-weight:600;letter-spacing:-.02em;margin-bottom:.3rem}
a{color:var(--accent)}
.wrap{max-width:880px;margin:0 auto;padding:0 1.5rem}
header .wrap{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.4rem 1.25rem;padding-top:1.1rem;padding-bottom:.9rem}
.logo{grid-column:1;grid-row:1}
.tgl{grid-column:2;grid-row:1;text-align:center;font-size:.9rem;color:var(--ink)}
.tgl b{font-weight:600}
#auth{grid-column:3;grid-row:1}
.logo{font-weight:600;color:var(--ink);text-decoration:none;letter-spacing:-.02em}
nav.top{grid-column:1/-1;grid-row:2;display:flex;flex-wrap:wrap;gap:1.25rem;font-size:.95rem}
nav.top a{color:var(--mute);text-decoration:none}
nav.top a[aria-current="page"]{color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
main{padding-top:2rem;padding-bottom:5rem;min-height:70vh}
.hero{position:relative;padding:1rem 0 1.5rem}
.hero::before{content:"";position:absolute;right:-6%;top:0;width:clamp(150px,32vw,300px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--accent),transparent 68%);opacity:.5;pointer-events:none}
.hero>*{position:relative}
.sub{font-size:.9rem;font-style:italic;color:var(--ink);max-width:32em;margin:0}
.menu{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.menu a{display:flex;flex-direction:column;gap:.3rem;min-height:140px;padding:1.1rem 1.2rem;background:var(--surface);border:1px solid var(--line);border-radius:16px;color:var(--ink);text-decoration:none;transition:border-color .2s,transform .2s}
.menu a>span:first-child{order:1;font-size:1.2rem;font-weight:600;letter-spacing:-.02em}
.menu a:hover,.menu a:focus-visible{border-color:var(--accent);transform:translateY(-3px)}
.menu small{order:2;font-size:.78rem;color:var(--mute)}
#auth input[type=checkbox]{width:1rem;height:1rem;padding:0;accent-color:var(--accent);vertical-align:middle}
.hl{order:3;margin-top:auto;font-size:.85rem;line-height:1.5;color:var(--accent);text-align:left;min-width:0;max-height:4.5em;overflow:hidden}
.entry{padding:1.6rem 0;border-top:1px solid var(--line)}
.entry p{max-width:36em;margin:.8rem 0 0;white-space:pre-line}
.entry figure{margin:1.25rem 0 0;max-width:36em}
.entry img{display:block;width:100%;height:auto;border-radius:12px}
.entry figcaption{margin-top:.5rem}
.meta{font-size:.85rem;color:var(--mute)}
button,.btn{font:600 .95rem Sora,sans-serif;cursor:pointer;border:0;border-radius:999px;padding:.7rem 1.4rem;background:var(--accent);color:var(--on);text-decoration:none;display:inline-block}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.x{background:none;color:var(--mute);padding:.2rem .5rem;font-weight:300}
input,select{font:300 1rem Sora,sans-serif;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem;width:100%}
input:focus,select:focus{border-color:var(--accent)}
.form{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin:.9rem 0 1rem}
.tabs{display:flex;gap:1.5rem;margin:0 0 1.75rem}
.tabs a{color:var(--mute);text-decoration:none;padding:.3rem 0;border-bottom:2px solid transparent}
.tabs button{background:none;color:var(--mute);border-radius:0;padding:.3rem 0;border-bottom:2px solid transparent;font-weight:300}
.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.item{display:flex;align-items:center;gap:.9rem;padding:.8rem 0;border-top:1px solid var(--line)}
.item .grow{flex:1;min-width:0}.item.done .grow{text-decoration:line-through;color:var(--mute)}
.item input[type=checkbox]{width:1.2rem;height:1.2rem;accent-color:var(--accent)}
.check{padding:.4rem 0 .4rem 1rem;border-left:3px solid var(--accent);margin:1rem 0}
.check.warn{border-color:#FFB454;color:#FFB454}
.note{color:var(--mute);font-size:.9rem;margin:0 0 1.75rem}
footer{border-top:1px solid var(--line);color:var(--mute);font-size:.85rem}
footer .wrap{padding-top:1.25rem;padding-bottom:1.25rem}
@media (max-width:700px){header .wrap{grid-template-columns:1fr auto}.tgl{grid-column:1/-1;grid-row:2;text-align:left}nav.top{grid-row:3}}
@media (max-width:560px){.menu{grid-template-columns:1fr}.menu a{min-height:0}}
@media (prefers-reduced-motion:reduce){.menu a{transition:none}}
</style>
</head>
<body>
<header><div class="wrap"><a class="logo" href="#beranda">Qibar Mandiri</a><div class="tgl" id="tgl"></div><div id="auth" class="ui"></div><nav class="top" id="nav" aria-label="Menu utama"></nav></div></header>
<main class="wrap" id="view"></main>
<footer><div class="wrap">© <span id="yr"></span> Qibar Mandiri · <a href="#privasi">Kebijakan privasi</a></div></footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
/* Konfigurasi Firebase dibaca dari berkas firebase-config.js (dipakai bersama oleh katalog-buku.html) */
const FIREBASE_CONFIG = window.FIREBASE_CONFIG || null;

/* ===== 2. ISI KONTEN: ubah dan tambah sendiri di sini ===== */
const CONTENT = {
  books: [
    {title:"7 Habits", author:"Stephen Covey", date:"2014", text:"Saya mengetik ulang 7 kebiasaan sebagai tanda bahwa sudah mengingat kembali pokok-pokoknya. Saya mendapatkan training berdasarkan buku ini pada tahun 2014 lalu saat saya bekerja di sebuah perusahaan otomotif di Surabaya.\n\n7 habits oleh Stephen Covey :\n1. Menjadi proaktif, bahwa saya lah yang memiliki kontrol atas diri saya sendiri, bukan orang lain atau lingkungan.\n2. Memulai dari hasil akhir pikiran. Menentukan target akhir, selanjutnya saya membuat rencana peta jalan/blueprint dengan fokus pada tujuan apa yang mau saya capai.\n3. Mendahulukan yang utama. Yang terencana dan penting ada di kuadran 2 (penting tapi tidak mendesak)  yang harus saya prioritaskan. Dibandingkan dengan yang mendesak penting (k1) apalagi tidak penting mendesak (k3) maupun tidak penting dan tidak mendesak (k4)\n4. Saya akan selalu mengupayakan win win solution dalam segala interaksi terkait orang lain, baik dalam hubungan kerja, bisnis, maupun bermasyarakat. Pesan penulis selalu saya ingat, jika tidak ada win win solution, lebih baik no deal. Daripada win lose atau bahkan lose win.\n5. Memahami dulu baru dipahami. Saya memilih mendengar dengan empati dan memahami sudut pandang lawan bicara sebelum saya menyampaikan ide pribadi saya. Saya membiasakan mengulang apa yang disampaikan lawan bicara sebagai konfirmasi apakah saya sudah memahami lawan bicara.\n6. Mewujudkan sinergi dengan mengambil semua sudut pandang, perbedaan ide dan sudut pandang adalah aset untuk dihimpun menjadi kekuatan bersama. Karena bisa jadi 1+1 >2.\n7. Mengasah gergaji. Saya perlu waktu jeda, daripada terus menerus beraktifitas meskipun positip. Karena bisa menurunkan produktifitas. Jeda itu seperti gergaji yg dipakai terus menerus, ada saatnya tumpul, harus jeda, berhenti, diasah dan dipertajam dulu. Saya perlu jeda, istirahat, membaca buku, rekreasi, kumpul keluarga, kumpul dengan teman, dan juga melakukan hobi."}
  ],
  opinions: [
    {title:"Opini Contoh: Kasus yang Sedang Ramai", date:"2026-11-20", source:"Nama media atau tautan berita", text:"Tulis opini Anda di sini. Sebutkan fakta yang sudah terkonfirmasi, lalu pisahkan dari pendapat pribadi Anda."}
  ],
  videos: [
    {title:"Video ringkasan buku (contoh)", url:"https://www.youtube.com/", note:"Tautan video untuk ringkasan buku."},
    {title:"Video opini (contoh)", url:"https://www.youtube.com/", note:"Tautan video untuk opini berita."}
  ]
};

/* ===== Kode di bawah ini tidak perlu diubah ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(u) ? u : "#";
const SP = [["#7A1F2B","#fff"],["#1F4D3A","#fff"],["#D9A21B","#101828"],["#274690","#fff"],["#5B2A6E","#fff"]];
function qmIngat() { try { return localStorage.getItem("qm_ingat") === "1"; } catch (e) { return false; } }
function qmPersist(a) { a.setPersistence(qmIngat() ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION).catch(function () {}); }
function qmPasangIngat(a) {
  var c = document.getElementById("ingat"); if (!c) return;
  c.checked = qmIngat();
  c.onchange = function () { try { localStorage.setItem("qm_ingat", c.checked ? "1" : "0"); } catch (e) {} qmPersist(a); };
}
function qmMasuk(a) {
  var p = new firebase.auth.GoogleAuthProvider();
  p.setCustomParameters({ prompt: "select_account" });
  return a.signInWithPopup(p);
}
const HL_MAX = 10; /* batas maksimal judul terbaru di halaman depan; yang tampil menyesuaikan lebar tempat */
const demo = !FIREBASE_CONFIG;
let user = null, db = null, auth = null;

if (!demo) {
  firebase.initializeApp(FIREBASE_CONFIG);
  auth = firebase.auth(); db = firebase.firestore(); qmPersist(auth);
  auth.onAuthStateChanged(u => { user = u; renderAuth(); route(); });
}
async function load(name) {
  if (demo) { try { return JSON.parse(localStorage.getItem("qm_" + name)) || []; } catch (e) { return []; } }
  const d = await db.collection("users").doc(user.uid).collection("lists").doc(name).get();
  return d.exists ? (d.data().items || []) : [];
}
async function save(name, items) {
  if (demo) { try { localStorage.setItem("qm_" + name, JSON.stringify(items)); } catch (e) {} return; }
  await db.collection("users").doc(user.uid).collection("lists").doc(name).set({items});
}

const PAGES = [["beranda","Beranda"],["buku","Buku"],["opini","Opini"],["video","Video"],["aplikasi","Aplikasi"]];

function renderAuth() {
  const a = $("#auth");
  if (demo) { a.innerHTML = '<span class="meta">Mode contoh</span>'; return; }
  a.innerHTML = user ? `<span class="meta">${esc(user.displayName || user.email)}</span> <button class="ghost" id="out">Keluar</button>` : '<label class="meta"><input type="checkbox" id="ingat"> Ingat saya</label> <button id="in">Masuk dengan Google</button>';
  if ($("#in")) { qmPasangIngat(auth); $("#in").onclick = () => qmMasuk(auth).catch(e => alert("Gagal masuk: " + e.message)); }
  if ($("#out")) $("#out").onclick = () => auth.signOut();
}

function route() {
  const p = (location.hash || "#beranda").slice(1);
  $("#nav").innerHTML = PAGES.map(([k, v]) => `<a href="#${k}" ${k === p ? 'aria-current="page"' : ""}>${v}</a>`).join("");
  const v = $("#view");
  const entry = (i, t, meta, body, img, cap) => `<article class="entry" style="--c:${SP[i % 5][0]}"><div><h3>${esc(t)}</h3><div class="meta">${meta}</div><p>${esc(body)}</p>${img ? `<figure><img src="${esc(img)}" alt="${esc(cap || t)}" loading="lazy">${cap ? `<figcaption class="meta">${esc(cap)}</figcaption>` : ""}</figure>` : ""}</div></article>`;
  if (p === "buku") v.innerHTML = `<h2>Ringkasan buku</h2>` + CONTENT.books.map((b, i) => entry(i, b.title, `${esc(b.author)} · dibaca ${esc(b.date)}`, b.text, b.image, b.caption)).join("");
  else if (p === "opini") v.innerHTML = `<h2>Opini</h2>` + CONTENT.opinions.map((o, i) => entry(i + 1, o.title, `${esc(o.date)} · Sumber: ${esc(o.source)}`, o.text, o.image, o.caption)).join("");
  else if (p === "video") v.innerHTML = `<h2>Video</h2>` + CONTENT.videos.map((x, i) => `<article class="entry" style="--c:${SP[(i + 2) % 5][0]}"><div><h3>${esc(x.title)}</h3><p>${esc(x.note)}</p><p><a class="btn" href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener">Tonton video</a></p></div></article>`).join("");
  else if (p === "aplikasi") renderApp();
  else if (p === "privasi") v.innerHTML = `<h2>Kebijakan privasi</h2><p>Qibar Mandiri hanya menyimpan nama, email Google, dan catatan yang Anda tulis sendiri. Data hanya bisa dilihat oleh akun Anda dan tidak dibagikan ke pihak lain. Anda dapat meminta data Anda dihapus kapan saja dengan menghubungi pemilik web.</p>`;
  else {
    const newest = arr => [...arr].sort((x, y) => String(y.date || "").localeCompare(String(x.date || ""))).slice(0, HL_MAX).map(x => x.title);
    const hb = newest(CONTENT.books), ho = newest(CONTENT.opinions), hv = newest(CONTENT.videos);
    const M = [["Ringkasan Buku","#buku","Isi buku dalam beberapa menit","","buku",hb],["Opini","#opini","Kabar dan kasus yang sedang ramai","","opini",ho],["Video","#video","Versi tontonan","","video",hv],["Katalog Buku","katalog-buku.html","Cek sebelum membeli","","katalog",[]],["Catatan Kegiatan Harian","aktivitas_harian.html","Pantau aktivitas harian","","aktivitas",[]]];
    v.innerHTML = `<section class="hero"><p class="sub">“Seorang terpelajar harus sudah berbuat adil sejak dalam pikiran, apalagi dalam perbuatan”</p><p class="meta" style="margin-top:.4rem;font-size:.75rem">Pramoedya Ananta Toer</p></section><nav class="menu" aria-label="Bagian web">${M.map(m => `<a href="${m[1]}" ${m[3] ? `data-tab="${m[3]}"` : ""}><span>${m[0]}</span><span class="hl" id="hl-${m[4]}" data-items="${esc(JSON.stringify(m[5]))}"></span><small>${m[2]}</small></a>`).join("")}</nav>`;
    fitAll();
    fillHl();
  }
}

function fitHl(el) {
  if (!el) return;
  let items; try { items = JSON.parse(el.dataset.items || "[]"); } catch (e) { items = []; }
  el.textContent = items.join(" · ");
  const over = () => el.scrollHeight > el.clientHeight + 1;
  while (items.length > 1 && over()) { items.pop(); el.textContent = items.join(" · "); }
  if (items.length === 1 && over()) { let t = items[0]; while (t.length > 1 && over()) { t = t.slice(0, -2); el.textContent = t.trimEnd() + "…"; } }
}
const fitAll = () => document.querySelectorAll(".hl").forEach(fitHl);
function setHl(id, arr) { const el = $("#hl-" + id); if (el) { el.dataset.items = JSON.stringify(arr); fitHl(el); } }

async function fillHl() {
  try {
    if (demo || !user) return;
    const b = await load("katalog");
    setHl("katalog", b.slice(-HL_MAX).reverse().map(x => x.judul).filter(Boolean));
    const a = await load("aktivitas");
    const open = a.filter(x => x.status === "open");
    const src = (open.length ? open : a).slice().sort((x, y) => String(y.tanggalMulai || "").localeCompare(String(x.tanggalMulai || "")));
    setHl("aktivitas", src.map(x => x.subjek).filter(x => x && x !== "Subjek baru...").slice(0, HL_MAX));
  } catch (e) {}
}


function renderApp() {
  $("#view").innerHTML = `<h2>Aplikasi</h2><nav class="menu" aria-label="Daftar aplikasi">
    <a href="katalog-buku.html"><span>Katalog Buku</span><small>Cek sebelum membeli</small></a>
    <a href="aktivitas_harian.html"><span>Catatan Kegiatan Harian</span><small>Pantau aktivitas harian</small></a></nav>
    <p class="note" style="margin-top:1.5rem">Masuk dengan akun Google di salah satu aplikasi. Datanya tersimpan di cloud dan hanya bisa dilihat oleh akun Anda.</p>`;
}

function tanggal() {
  const d = new Date(), P = ["Legi", "Pahing", "Pon", "Wage", "Kliwon"];
  const n = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
  const hari = d.toLocaleDateString("id-ID", {weekday: "long"});
  const sisa = d.toLocaleDateString("id-ID", {day: "numeric", month: "long", year: "numeric"});
  $("#tgl").innerHTML = `<b>${hari} ${P[(n + 3) % 5]}</b>, ${sisa}`;
}
tanggal(); setInterval(tanggal, 60000);
$("#yr").textContent = new Date().getFullYear();
window.addEventListener("hashchange", route);
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(fitAll, 120); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
renderAuth(); route();
</script>
</body>
</html>
